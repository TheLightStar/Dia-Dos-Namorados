<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player de Música</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#121212;
    color:white;
    min-height:100vh;
}

/* Cabeçalho fixo */
.header{
    position:sticky;
    top:0;
    background:#1e1e1e;
    padding:15px;
    z-index:100;
    border-bottom:1px solid #333;
}

.music-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.music-info img{
    width:60px;
    height:60px;
    border-radius:8px;
    object-fit:cover;
}

.music-title{
    font-size:22px;
    font-weight:bold;
}

.artist{
    color:#b3b3b3;
}

/* Conteúdo */
.container{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* Cartões */
.card{
    background:#1d1d1d;
    border-radius:20px;
    overflow:hidden;
}

.card img{
    width:100%;
    display:block;
}

.card-content{
    padding:20px;
}

.card h2{
    margin-bottom:10px;
}

.card p{
    color:#d1d1d1;
    line-height:1.5;
}

/* Prévia */
.lyrics{
    font-size:24px;
    font-weight:bold;
    line-height:1.4;
}

/* Vídeos relacionados */
.videos{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:10px;
}

.video{
    min-width:180px;
    background:#2a2a2a;
    border-radius:15px;
    overflow:hidden;
}

.video img{
    height:120px;
    object-fit:cover;
}

.video p{
    padding:10px;
}

/* Responsivo */
@media (max-width:480px){

    .music-title{
        font-size:18px;
    }

    .lyrics{
        font-size:18px;
    }

    .video{
        min-width:140px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="music-info">
        <img src="LariRosa.jpg" alt="">
        <div>
            <div class="music-title">Nossos Dias</div>
            <div class="artist">Larissa</div>
        </div>
    </div>
</div>

<div class="container">

    <div class="card">
        <img src="LariRindo.jpg" alt="">
        <div class="card-content">
            <h2>Sobre a artista</h2>
            <p>
                Larissa Gil Lima foi uma das artistas mais influentes
                da história da minha Vida.
            </p>
        </div>
    </div>

    <div class="card">
        <div class="card-content">
            <h2>Prévia da letra</h2>
            <div class="lyrics">
                Obrigado por ser você,<br>
                Obrigado por me amar,<br>
                Te desejo um ótimo dia dos namorados,<br>
                VIDA
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-content">
            <h2>Vídeos relacionados</h2>

                <div class="video">
                    <video controls width="100%">
                    <source src="Video.mp4" type="video/mp4">
                    </video>
                    <p>Videos de você</p>
                </div>

                <div class="video">
                    <img src="Festa.jpeg">
                    <p>Curtindo Com Você</p>
                </div>

                <div class="video">
                    <img src="Lindos.jpg">
                    <p>Muita Pizza</p>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
